# Nav2 keepout_filter 参数示例
#
# 配合 PGM_EDITOR 的“禁行区 → 导出掩膜”生成的
#   map_keepout.pgm
#   map_keepout.yaml
# 使用。
#
# 注意：
#   - 下面的节点名 / 命名空间只是示例，请合并到你自己的 Nav2 参数文件中；
#   - 不同 Nav2 版本的参数名可能略有差异，以所用版本的官方示例为准；
#   - 掩膜的 resolution / origin 必须与地图一致（PGM_EDITOR 导出时已保证）。

local_costmap:
  local_costmap:
    ros__parameters:
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"

filter_mask_server:
  ros__parameters:
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    yaml_filename: "/absolute/path/to/map_keepout.yaml"

costmap_filter_info_server:
  ros__parameters:
    type: 0                 # 0 = keepout, 1 = speed
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
